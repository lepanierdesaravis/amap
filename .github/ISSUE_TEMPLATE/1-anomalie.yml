name: Anomalie
description: Quelque chose ne fonctionne pas comme prévu sur le site.
title: "[Anomalie] "
labels: [anomalie]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Une anomalie par ticket. Plus c'est précis, plus c'est rapide à corriger.
  - type: input
    id: exigence
    attributes:
      label: Exigence concernée
      description: Numéro dans le cahier des charges (docs/02-cahier-des-charges.md), si vous le connaissez.
      placeholder: ADH-07
  - type: dropdown
    id: role
    attributes:
      label: Connecté en tant que
      options:
        - Visiteur (non connecté)
        - Adhérent
        - Référent
        - Producteur
        - Administrateur
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Adresse de la page
      placeholder: https://…/mon-espace/contrats
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Ce que j'ai fait
      description: Les étapes, dans l'ordre.
      placeholder: |
        1. Je clique sur « Souscrire » pour le Corti des Aravis
        2. Je choisis 1 panier, une semaine sur deux
        3. …
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce que j'attendais
    validations:
      required: true
  - type: textarea
    id: obtenu
    attributes:
      label: Ce qui s'est passé
      description: Message d'erreur, écran inattendu… Vous pouvez coller une capture d'écran ici.
    validations:
      required: true
  - type: dropdown
    id: appareil
    attributes:
      label: Appareil
      options:
        - Téléphone
        - Tablette
        - Ordinateur
    validations:
      required: true
  - type: input
    id: navigateur
    attributes:
      label: Navigateur
      placeholder: Safari sur iPhone, Chrome sur Android, Firefox…
